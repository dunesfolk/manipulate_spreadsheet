<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>クロスオーダー受注データ変換</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    input, button { margin: 8px 0; width: 100%; }
  </style>
</head>
<body>
  <h1>クロスオーダー受注データ変換（ローカル処理）</h1>

  <p>クロスオーダーからダウンロードした受注データ（Shift-JIS エンコードされたカンマ区切りcsvファイル）を選択してください。</p>
  <input type="file" id="fileInput" accept=".csv" />

  <button onclick="processFile()">変換してCSVをエクスポート</button>

  <script>
    const UNIT_CODE_MAP = { "C/S": "01", "kg": "02", "ﾊﾞﾗ": "03", "B/L": "04" };

    function formatDate(value) {
      const m = value.trim().match(/^(\d{4})\/(\d{1,2})\/(\d{1,2})$/);
      if (!m) return value;
      const [, y, mo, d] = m;
      return `${y}/${mo.padStart(2, '0')}/${d.padStart(2, '0')}`;
    }

    function processFile() {
      const fileInput = document.getElementById('fileInput');
      if (!fileInput.files.length) {
        alert('ファイルを選択してください');
        return;
      }

      const file = fileInput.files[0];
      const reader = new FileReader();
      reader.readAsArrayBuffer(file);

      reader.onload = () => {
        // Shift-JIS decode
        const decoder = new TextDecoder('shift-jis');
        const text = decoder.decode(reader.result);

        const lines = text.split(/\r?\n/).filter(l => l.trim());
        if (lines[0].split(',')[0] !== 'H') {
          alert('書式が不正です。クロスオーダーから出力したファイルを入れてください。');
          return;
        }
        // 1行目はヘッダーではなくレコード種別行（H,,,...）のためスキップ
        const rows = lines.slice(1).map(l => l.split(','));
        const header = rows[0];

        const colIndex = {
          '［取引先コード］': header.indexOf('［取引先コード］'),
          '［自社管理商品コード］': header.indexOf('［自社管理商品コード］'),
          '［単位］': header.indexOf('［単位］'),
          '［数量］': header.indexOf('［数量］'),
          '［納品日］': header.indexOf('［納品日］'),
          '［金額］': header.indexOf('［金額］')
        };

        for (const k in colIndex) {
          if (colIndex[k] === -1) {
            alert(`列が見つかりません: ${k}`);
            return;
          }
        }

        const output = [];
        output.push(['得意先コード', '商品コード', '単位コード', '数量', '売上年月日', '金額(売上単価)', '備考1', '備考2']);

        for (let i = 1; i < rows.length; i++) {
          const r = rows[i];
          const kokyakuCode = (r[colIndex['［取引先コード］']] || '').trim().padStart(6, '0');
          const shohinCode = (r[colIndex['［自社管理商品コード］']] || '').trim().padStart(5, '0');
          const tanniCode = UNIT_CODE_MAP[(r[colIndex['［単位］']] || '').trim()] || '';
          const suryo = r[colIndex['［数量］']];
          const uriageDate = formatDate(r[colIndex['［納品日］']] || '');
          const kingaku = Number(r[colIndex['［金額］']]);
          const kingakuOut = kingaku > 0 ? String(kingaku) : '';
          const biko1 = kingaku > 0 ? 'ｸﾛｽｵｰﾀﾞｰ ｷｬﾝﾍﾟｰﾝ' : '';

          output.push([kokyakuCode, shohinCode, tanniCode, suryo, uriageDate, kingakuOut, biko1, '']);
        }

        // UTF-8 with BOM
        const bom = '﻿';
        const csv = output.map(r => r.join(',')).join('\r\n');
        const blob = new Blob([bom + csv], { type: 'text/csv;charset=utf-8;' });

        // 元ファイル名 + "-変換" を付けて保存
        const originalName = file.name;
        const dotIndex = originalName.lastIndexOf('.');
        const baseName = dotIndex !== -1 ? originalName.slice(0, dotIndex) : originalName;
        const extension = '.csv';
        const outputName = `${baseName}-変換${extension}`;

        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = outputName;
        a.click();
      };
    }
  </script>
</body>
</html>
